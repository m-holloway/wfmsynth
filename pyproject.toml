[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wfmsynth"
version = "0.1.0"
description = "Physics-informed synthetic waveform generation — channels, jitter, crosstalk, NRZ/PAM4/RF carriers, and realistic deep-memory scope captures."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michael Holloway" }]
requires-python = ">=3.8"
dependencies = ["numpy>=1.21", "scipy>=1.7"]
keywords = ["signal-integrity", "waveform", "synthesis", "PAM4", "SerDes", "jitter", "oscilloscope", "physics", "simulation", "synthetic-data"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["wfmsynth*"]
